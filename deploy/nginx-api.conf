# HireHand AI Backend — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/api.soumyajitbanerjee.in
# Then: sudo ln -s /etc/nginx/sites-available/api.soumyajitbanerjee.in /etc/nginx/sites-enabled/
#
# This is the HTTP-only version. Certbot will AUTOMATICALLY rewrite it
# to add the SSL (443) block and an HTTP->HTTPS redirect when you run:
#   sudo certbot --nginx -d api.soumyajitbanerjee.in

server {
    listen 80;
    listen [::]:80;
    server_name api.soumyajitbanerjee.in;

    # Allow resume PDF uploads
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        # WebSocket support (AI interview live socket: /api/ai-interview/{token}/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward real client info (FastAPI runs with --proxy-headers)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for AI / streaming responses
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }
}
